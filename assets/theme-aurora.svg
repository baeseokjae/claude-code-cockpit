    <tspan dx="6" class="green bold">5h:35%</tspan>
    <tspan dx="10" class="muted">7d:12%</tspan>
    <tspan class="muted"> │ </tspan>
    <tspan class="peach bold">$1.50</tspan>
  </text>

  <!-- Line 3: ● Tools: Read+12  Edit+8  Bash+5  Write+3  ✓87% ✗13% (28) -->
  <text y="76" class="text">
    <tspan x="16" class="blue bold">●</tspan>
    <tspan dx="4" class="blue">Tools:</tspan>
    <tspan dx="6">Read</tspan><tspan class="green">+</tspan><tspan class="muted">12</tspan>
    <tspan dx="8">Edit</tspan><tspan class="green">+</tspan><tspan class="muted">8</tspan>
    <tspan dx="8">Bash</tspan><tspan class="green">+</tspan><tspan class="muted">5</tspan>
    <tspan dx="8">Write</tspan><tspan class="green">+</tspan><tspan class="muted">3</tspan>
