      .bold { font-weight: bold; }
    </style>
  </defs>
  <rect class="bg" width="680" height="140" rx="8"/>

  <!-- Line 1: Model, Progress, Git, Usage, Duration -->
  <text y="28" class="text">
    <tspan x="16" class="blue bold">Opus 4.5</tspan>
    <tspan dx="8" class="green">▰▰▰▰</tspan><tspan class="muted">▱▱▱▱▱▱</tspan>
    <tspan dx="4" class="green bold">39%</tspan>
    <tspan dx="12" class="teal">my-project</tspan>
    <tspan class="mauve"> (main*)</tspan>
    <tspan dx="12" class="yellow bold">5h:30%</tspan>
    <tspan dx="12" class="muted">29m</tspan>
  </text>

  <!-- Line 2: Tools -->
  <text y="54" class="text">
    <tspan x="24" class="blue">●</tspan>
    <tspan dx="4" class="blue">Tools:</tspan>
    <tspan dx="8">Bash</tspan><tspan class="green">✓</tspan><tspan class="muted">⁶</tspan>
    <tspan dx="8">Read</tspan><tspan class="green">✓</tspan><tspan class="muted">⁴</tspan>
    <tspan dx="8">Edit</tspan><tspan class="green">✓</tspan><tspan class="muted">²</tspan>
    <tspan dx="8" class="muted">(12)</tspan>
  </text>

  <!-- Line 3: Agents -->
  <text y="80" class="text">
    <tspan x="24" class="mauve">●</tspan>
