    <tspan dx="4" class="red">✗13%</tspan>
    <tspan dx="4" class="muted">(28)</tspan>
  </text>

  <!-- Line 4: ● Agents: 3 [S]general-purpose⚡37  1 [O]planner -->
  <text y="102" class="text">
    <tspan x="16" class="mauve bold">●</tspan>
    <tspan dx="4" class="mauve">Agents:</tspan>
    <tspan dx="6" class="muted">3</tspan>
    <tspan dx="4" class="muted">[S]</tspan><tspan class="green">general-purpose</tspan><tspan class="teal">⚡37</tspan>
    <tspan dx="8" class="muted">1</tspan>
    <tspan dx="4" class="muted">[O]</tspan><tspan class="green">planner</tspan>
  </text>

