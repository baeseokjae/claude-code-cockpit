<svg xmlns="http://www.w3.org/2000/svg" width="680" height="140" viewBox="0 0 680 140">
  <defs>
    <style>
      .bg { fill: #181c24; }
      .text { fill: #d4dae6; font-family: 'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace; font-size: 13px; }
      .blue { fill: #6aa3d9; }
      .green { fill: #7bc98f; }
      .yellow { fill: #e0c878; }
      .red { fill: #d97082; }
      .mauve { fill: #a98dd4; }
      .teal { fill: #6bc4b8; }
