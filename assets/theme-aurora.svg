    <tspan dx="4" class="mauve bold">[IMPLEMENT]</tspan>
    <tspan dx="4" class="muted">conf:85%</tspan>
    <tspan dx="10" class="green">Tests:</tspan>
    <tspan dx="4" class="green bold">+87%</tspan>
    <tspan dx="10" class="muted">Config:</tspan>
    <tspan dx="4" class="teal">2</tspan><tspan class="muted"> .md</tspan>
    <tspan dx="10" class="muted">125 tok/s</tspan>
