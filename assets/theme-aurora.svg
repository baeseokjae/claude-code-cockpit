    <tspan dx="8">Explore</tspan><tspan class="green">✓</tspan>
    <tspan dx="8">Plan</tspan><tspan class="yellow">~</tspan>
  </text>

  <!-- Line 4: Todos -->
  <text y="106" class="text">
    <tspan x="24" class="teal">●</tspan>
    <tspan dx="4" class="teal">Todos:</tspan>
    <tspan dx="8" class="yellow">▸</tspan>
    <tspan dx="4">Fix authentication bug</tspan>
    <tspan dx="8" class="muted">(2/5)</tspan>
