<svg xmlns="http://www.w3.org/2000/svg" width="800" height="170" viewBox="0 0 800 170">
  <defs>
    <style>
      .bg { fill: #181c24; }
      .text { fill: #d4dae6; font-family: 'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace; font-size: 12px; }
      .blue { fill: #6aa3d9; }
      .green { fill: #7bc98f; }
      .yellow { fill: #e0c878; }
      .red { fill: #d97082; }
      .mauve { fill: #a98dd4; }
      .teal { fill: #6bc4b8; }
      .peach { fill: #d9946a; }
      .muted { fill: #8891a5; }
      .bold { font-weight: 600; }
    </style>
  </defs>
  <rect class="bg" width="800" height="170" rx="8"/>

  <!-- Line 1: Model [session] │ ▰▰▰▰▱▱▱▱▱▱ 45% │ Project(branch) ⇡3 1PR +891 -148 │ 32m 15s -->
  <text y="24" class="text">
    <tspan x="16" class="blue bold">Opus 4.6</tspan>
    <tspan class="muted"> [a1b2c3d4]</tspan>
    <tspan class="muted"> │ </tspan>
    <tspan class="green">▰▰▰▰▱▱▱▱▱▱</tspan>
    <tspan dx="4" class="green bold">45%</tspan>
    <tspan class="muted"> │ </tspan>
    <tspan class="teal">cockpit</tspan><tspan class="mauve">(main</tspan><tspan class="muted">*</tspan><tspan class="mauve">)</tspan>
    <tspan dx="4" class="green">⇡3</tspan>
    <tspan dx="4" class="mauve">1PR</tspan>
    <tspan dx="4" class="green">+891</tspan>
    <tspan dx="4" class="red">-148</tspan>
    <tspan class="muted"> │ </tspan>
    <tspan class="muted">32m 15s</tspan>
  </text>

  <!-- Line 2: ● Usage: 5h:35%  7d:12% │ $1.50 -->
  <text y="50" class="text">
    <tspan x="16" class="teal bold">●</tspan>
