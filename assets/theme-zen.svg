<svg xmlns="http://www.w3.org/2000/svg" width="800" height="180" viewBox="0 0 800 180">
  <defs>
    <style>
      .bg { fill: #f5f5f0; }
      .text { fill: #3a3a35; font-family: 'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace; font-size: 12px; }
      .sage { fill: #6b8e6b; }
      .stone { fill: #7a7a75; }
      .earth { fill: #8b7355; }
      .clay { fill: #a0826d; }
      .moss { fill: #7d8b73; }
      .muted { fill: #9a9a95; }
      .bold { font-weight: 600; }
    </style>
  </defs>
  <rect class="bg" width="800" height="180" rx="8"/>

  <!-- Line 1: Model, Progress, Git with tag, Usage -->
  <text y="24" class="text">
    <tspan x="16" class="sage bold">Opus 4.6</tspan>
    <tspan dx="8" class="sage">====</tspan><tspan class="muted">-----</tspan>
    <tspan dx="4" class="sage bold">45%</tspan>
    <tspan dx="12" class="moss">claude-code-cockpit</tspan>
    <tspan class="stone"> (main</tspan><tspan class="muted">*</tspan><tspan class="stone">)</tspan>
    <tspan class="muted"> v1.0.0</tspan>
    <tspan dx="12" class="earth bold">5h:30%</tspan>
    <tspan dx="8" class="muted">7d:15%</tspan>
    <tspan dx="12" class="muted">32m 15s</tspan>
  </text>

  <!-- Line 2: Git Activity & Lines & Cache -->
  <text y="48" class="text">
    <tspan x="24" class="moss">o</tspan>
    <tspan dx="4">Git:</tspan>
    <tspan dx="8" class="sage">+3 commits</tspan>
    <tspan dx="8" class="stone">+1 PR</tspan>
    <tspan dx="16" class="sage">+891</tspan>
    <tspan dx="4" class="earth">-148</tspan>
    <tspan dx="16" class="sage">Cache:</tspan>
    <tspan dx="4" class="sage">75%</tspan>
    <tspan dx="4" class="muted">hit</tspan>
    <tspan dx="8" class="clay">$0.12</tspan>
    <tspan dx="4" class="muted">saved</tspan>
  </text>

  <!-- Line 3: Tools with success rate -->
  <text y="72" class="text">
    <tspan x="24" class="sage">o</tspan>
    <tspan dx="4" class="sage">Tools:</tspan>
    <tspan dx="8">Read</tspan><tspan class="sage">+</tspan><tspan class="muted">12</tspan>
    <tspan dx="8">Edit</tspan><tspan class="sage">+</tspan><tspan class="muted">8</tspan>
    <tspan dx="8">Bash</tspan><tspan class="sage">+</tspan><tspan class="muted">5</tspan>
    <tspan dx="8">Write</tspan><tspan class="sage">+</tspan><tspan class="muted">3</tspan>
    <tspan dx="12" class="sage">+87%</tspan>
    <tspan dx="4" class="earth">-13%</tspan>
    <tspan dx="4" class="muted">(28)</tspan>
  </text>

  <!-- Line 4: Agents -->
  <text y="96" class="text">
    <tspan x="24" class="stone">o</tspan>
    <tspan dx="4" class="stone">Agents:</tspan>
    <tspan dx="8">planner</tspan><tspan class="sage">+</tspan><tspan class="muted">[s]</tspan>
    <tspan dx="8">code-reviewer</tspan><tspan class="sage">+</tspan><tspan class="muted">[o]</tspan>
    <tspan dx="8">build-fix</tspan><tspan class="earth">~</tspan><tspan class="muted">[h]</tspan>
  </text>

  <!-- Line 5: Workflow Phase & Test Coverage -->
  <text y="120" class="text">
    <tspan x="24" class="moss">o</tspan>
    <tspan dx="4">Phase:</tspan>
    <tspan dx="8" class="stone bold">[IMPLEMENT]</tspan>
    <tspan dx="4" class="muted">85%</tspan>
    <tspan dx="16" class="sage">Tests:</tspan>
    <tspan dx="4" class="sage bold">+ 87%</tspan>
    <tspan dx="4" class="muted">(309/356)</tspan>
    <tspan dx="16" class="sage">Pass@1:</tspan>
    <tspan dx="4" class="sage">78%</tspan>
  </text>

  <!-- Line 6: Config & Cost -->
  <text y="144" class="text">
    <tspan x="24" class="muted">o</tspan>
    <tspan dx="4" class="muted">Config:</tspan>
    <tspan dx="4" class="moss">2</tspan><tspan class="muted"> .md</tspan>
    <tspan dx="8" class="sage">3</tspan><tspan class="muted"> rules</tspan>
    <tspan dx="8" class="stone">2</tspan><tspan class="muted"> MCP</tspan>
    <tspan dx="8" class="sage">4</tspan><tspan class="muted"> hooks</tspan>
    <tspan dx="16" class="clay bold">Cost: $0.47</tspan>
    <tspan dx="12" class="muted">125 tok/s</tspan>
  </text>

  <!-- Line 7: Alerts & Suggestions -->
  <text y="168" class="text">
    <tspan x="24" class="earth">!</tspan>
    <tspan dx="4" class="earth">28 calls try /compact</tspan>
    <tspan dx="16" class="muted">Security: </tspan><tspan class="sage">92</tspan>
    <tspan dx="16" class="muted">MCP: 2 servers (15 calls)</tspan>
  </text>
</svg>
