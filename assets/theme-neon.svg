<svg xmlns="http://www.w3.org/2000/svg" width="680" height="140" viewBox="0 0 680 140">
  <defs>
    <style>
      .bg { fill: #0d0d0d; }
      .text { fill: #ffffff; font-family: 'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace; font-size: 13px; }
      .cyan { fill: #00d4ff; }
      .green { fill: #39ff14; }
      .yellow { fill: #ffff00; }
      .pink { fill: #ff0055; }
      .purple { fill: #bf00ff; }
      .mint { fill: #00ffcc; }
      .muted { fill: #606080; }
      .bold { font-weight: bold; }
    </style>
  </defs>
  <rect class="bg" width="680" height="140" rx="8"/>

  <!-- Line 1: Model, Progress, Git, Usage, Duration -->
  <text y="28" class="text">
    <tspan x="16" class="cyan bold">OPUS 4.5</tspan>
    <tspan dx="8" class="green">▓▓▓▓</tspan><tspan class="muted">░░░░░░</tspan>
    <tspan dx="4" class="green bold">39%</tspan>
    <tspan dx="12" class="mint">MY-PROJECT</tspan>
    <tspan class="purple"> (MAIN*)</tspan>
    <tspan dx="12" class="yellow bold">5H:30%</tspan>
    <tspan dx="12" class="muted">29M</tspan>
  </text>

  <!-- Line 2: Tools -->
  <text y="54" class="text">
    <tspan x="24" class="cyan">●</tspan>
    <tspan dx="4" class="cyan">TOOLS:</tspan>
    <tspan dx="8">BASH</tspan><tspan class="green">✓</tspan><tspan class="muted">⁶</tspan>
    <tspan dx="8">READ</tspan><tspan class="green">✓</tspan><tspan class="muted">⁴</tspan>
    <tspan dx="8">EDIT</tspan><tspan class="green">✓</tspan><tspan class="muted">²</tspan>
    <tspan dx="8" class="muted">(12)</tspan>
  </text>

  <!-- Line 3: Agents -->
  <text y="80" class="text">
    <tspan x="24" class="purple">●</tspan>
    <tspan dx="4" class="purple">AGENTS:</tspan>
    <tspan dx="8">EXPLORE</tspan><tspan class="green">✓</tspan>
    <tspan dx="8">PLAN</tspan><tspan class="yellow">~</tspan>
  </text>

  <!-- Line 4: Todos -->
  <text y="106" class="text">
    <tspan x="24" class="mint">●</tspan>
    <tspan dx="4" class="mint">TODOS:</tspan>
    <tspan dx="8" class="yellow">▸</tspan>
    <tspan dx="4">FIX AUTHENTICATION BUG</tspan>
    <tspan dx="8" class="muted">(2/5)</tspan>
  </text>

  <!-- Line 5: Usage -->
  <text y="132" class="text">
    <tspan x="24" class="cyan">●</tspan>
    <tspan dx="4" class="cyan">USAGE:</tspan>
    <tspan dx="8" class="yellow bold">5H: 30%</tspan>
    <tspan dx="4" class="muted">↻ 4H21M</tspan>
    <tspan dx="12" class="green bold">7D: 75%</tspan>
    <tspan dx="4" class="muted">↻ 42H21M</tspan>
  </text>
</svg>
