      .dim { fill: #767676; }
      .bold { font-weight: 600; }
    </style>
  </defs>
  <rect class="bg" width="800" height="72" rx="8"/>

  <!-- Line 1: [Model] [sess] | [####------] 45% | project (branch*) | +891 -148 | 32m 15s | 5h:35% -->
